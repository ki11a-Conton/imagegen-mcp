# 本地钩子：提交前自动修格式与 lint，只处理本次改动的文件。
# 安装：pip install pre-commit && pre-commit install
# 版本固定，不跟随最新版。

repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(mjs|yml|yaml|json|md)$
        exclude: ^(node_modules|output|package-lock\.json)

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.15.0
    hooks:
      - id: eslint
        files: \.mjs$
        exclude: ^(node_modules|output)
        additional_dependencies:
          - eslint@9.15.0
          - "@eslint/js@9.15.0"
          - globals@15.12.0
