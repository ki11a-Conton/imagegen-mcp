# 本地钩子：提交前自动修格式与 lint，只处理本次改动的文件。
# 安装：pre-commit install
#
# 用 repo: local + language: system，直接跑项目本地装的工具：
#   - 与 CI 同一版本（package.json 的 devDependencies），不另建一份
#   - 不触网、不建 nodeenv（nodeenv 在 Node 版本号带后缀时直接崩，见 2026-11-16 记录）
# 文件范围与 CI 的 format:check / lint 一致：markdown 不在其中。
# 文档按「一行一句」手写，prettier 会重排中文段落，所以不纳入钩子。

repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier --write
        entry: node node_modules/prettier/bin/prettier.cjs --write
        language: system
        files: \.(mjs|yml|yaml)$
        exclude: ^(node_modules|output)/
      - id: eslint
        name: eslint --fix
        entry: node node_modules/eslint/bin/eslint.js --fix
        language: system
        files: \.mjs$
        exclude: ^(node_modules|output)/
